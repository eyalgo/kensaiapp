<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 516" width="960" height="516" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">KensaiApp overview</title>
<desc id="d">Three stacked bands. Product intent: PRD, then Definition of done, then Product documents. Journey: Seed, then Station, then Change. One change: Ask (PM), Spec (Product owner), Design (Architect), Plan (Tech lead), Content (Content editor, optional), Build (Developer), Prove (Senior engineer), Security (Senior engineer), Audit (Auditor), Seal (PM). Below them: Lands in git: documents, code, tests, findings, the trail of each change. On the side: Owner: direction and the calls only you can make. Program: decides what runs next. Roles: one job each.</desc>
