name: Feature request
description: Something KensaiApp does not do, or a change to how it works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        KensaiApp is maintained privately and has no roadmap. Each request is read, with no promise that it is built.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where KensaiApp falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The change you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
