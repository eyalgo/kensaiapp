# One config for both suites under core/ — `core/tools/` and `core/launchers/`.
# `-n 32`: the tests mostly wait on subprocesses, so more workers than cores still pays
# (measured 2026-09-18 on 16 cores: core/tools 299s serial → 65s). Needs pytest-xdist;
# `-n 0` runs serially — for `--pdb`, `-s`, or a single test.
[pytest]
addopts = -n 32
