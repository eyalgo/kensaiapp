[project]
name = "tracker17"
version = "0.0.0"
requires-python = ">=3.11"

# The tools this file configures below, so they run from the product's own environment rather than
# from whatever the host happens to have. Exact pins, not floors: a later install must not change
# behaviour without a diff (PD-7; SDD § 4 RT-4), and `tests/requirements.txt` locks these with
# everything they pull in. `uv run <tool>` resolves these; `uvx <tool>` deliberately does not, and
# reaches past both this group and `requires-python`.
[dependency-groups]
dev = [
    "mypy==2.4.0",
    "playwright==1.63.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
